name: Gerar animação da cobrinha

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=111111&color_dots=ebedf0,fecaca,f87171,dc2626,991b1b
            dist/github-snake-dark.svg?palette=github-dark&color_snake=ffffff&color_dots=161b22,7f1d1d,b91c1c,e32219,ff5a4d

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
